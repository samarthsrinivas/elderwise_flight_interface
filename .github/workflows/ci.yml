name: ci

# Pre-flight checks for every pull request and push to main, and the
# pre-release gate (release.yml calls this via workflow_call before building
# installers).
#
# Elderwise targets macOS only. Rust checks run on a pinned macOS runner so
# the crate compiles against the real target frameworks (keychain, WKWebView)
# without surprise macos-latest image migrations. Windows and Linux are
# intentionally skipped - do not add them back without a platform-support
# decision. Frontend checks are platform-agnostic and run on ubuntu for speed
# and runner cost.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.2

jobs:
  frontend:
    name: frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: typecheck (app + remotion)
        run: bunx tsc --noEmit

      - name: unit tests
        run: bun run test

      - name: production build
        run: bun run build


  rust:
    name: rust checks (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # tauri::generate_context! requires the frontendDist path to exist at
      # compile time; an empty placeholder is enough for check/lint/test.
      - name: prepare frontendDist placeholder
        run: mkdir -p dist

      - name: format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: lint (clippy, warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
